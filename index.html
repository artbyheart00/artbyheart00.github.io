<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art by Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', serif;
        }

        body {
            background-color: #f5efe6;
            color: #333;
            text-align: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #f5efe6;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Logo image styling matching your exact layout */
        .logo-section img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo-text p {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #777;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        .search-cart {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
        }

        .hero-section {
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-section h2 {
            font-size: 36px;
            font-weight: normal;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .hero-section p {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .shop-btn {
            background-color: #2b2523;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-size: 14px;
            text-transform: uppercase;
            border-radius: 4px;
            display: inline-block;
        }

        .catalog-title {
            font-size: 28px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .tabs {
            margin-bottom: 30px;
        }

        .tab {
            margin: 0 15px;
            cursor: pointer;
            font-size: 16px;
            color: #777;
            padding-bottom: 5px;
        }

        .tab.active {
            color: #000;
            border-bottom: 2px solid #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <img src="images/artby heart logo.jpg" alt="Art by Heart Logo">
            <div class="logo-text">
                <h1>Art By Heart</h1>
                <p>Crochetique</p>
            </div>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Shop Collection</a>
            <a href="#">Our Story</a>
            <a href="#">Custom Orders</a>
            <a href="#">Contact</a>
        </nav>
        <div class="search-cart">
            <input type="text" class="search-box" placeholder="Search...">
            <span>🛒</span>
        </div>
    </header>

    <div class="hero-section">
        <h2>Where art meets heart. Clean lines, soft textures, made entirely by hand.</h2>
        <p>Crochetique descriptive tag</p>
        <a href="#shop-grid-section" class="shop-btn">Shop The Collection</a>
    </div>

    <h3 class="catalog-title">Product Catalog</h3>
    <div class="tabs">
        <span class="tab active">All Pieces</span>
        <span class="tab">Wearables</span>
    </div>

</body>
</html>
