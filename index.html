<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art by Heart | Crochetique</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- Simple Base Styles (Pehle Wala Structure) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7f4ee; /* Editorial Cream Background */
            color: #2c2a29;
            line-height: 1.6;
        }

        /* --- Header & Logo Integration --- */
        .site-header {
            width: 100%;
            padding: 1rem 4%;
            background-color: #f7f4ee;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .site-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: contain;
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 500;
            color: #d49a97; /* Dusty Rose Pink */
        }

        .tagline {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #7a7571;
            margin-top: -3px;
            display: block;
        }

        /* --- Minimalist Nav --- */
        .site-nav {
            display: flex;
            gap: 1.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: #2c2a29;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            color: #d49a97;
        }

        /* --- Basic Grid Section --- */
        .product-section {
            max-width: 1100px;
            margin: 4rem auto;
            padding: 0 4%;
            text-align: center;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
        }

        .product-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #eae5de;
            border-radius: 6px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-name {
            font-size: 0.95rem;
            color: #2c2a29;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .shop-now-btn {
            display: inline-block;
            text-decoration: none;
            background-color: #2c2a29;
            color: #ffffff;
            padding: 0.6rem 1.8rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 3px;
        }

        /* --- Minimalist Mobile View (Standard Zoom Only) --- */
        @media (max-width: 768px) {
            .site-header {
                flex-direction: column;
                gap: 10px;
            }
            .site-nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            .product-grid {
                grid-template-columns: repeat(2, 1fr); /* Mobile grid view from mockup */
                gap: 1rem;
            }
            .product-name {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="brand-logo-section">
            <img src="image_cb7ccd.jpg" alt="Art by Heart Logo" class="site-logo">
            <div class="brand-text">
                <h1 class="brand-title">Art By Heart</h1>
                <span class="tagline">Crochetique</span>
            </div>
        </div>
        
        <nav class="site-nav">
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link">Shop</a>
            <a href="#" class="nav-link">Story</a>
            <a href="#" class="nav-link">Contact</a>
        </nav>
    </header>

    <section class="product-section">
        <div class="product-grid">
            <div class="product-item">
                <div class="product-image-container">
                    <img src="images/wristlets.jpg" alt="Gajray Wristlets">
                </div>
                <h4 class="product-name">Traditional Gajray</h4>
                <a href="#" class="shop-now-btn">SHOP NOW</a>
            </div>

            <div class="product-item">
                <div class="product-image-container">
                    <img src="images/sunflower.jpg" alt="Sunflower">
                </div>
                <h4 class="product-name">Forever Sunflower</h4>
                <a href="#" class="shop-now-btn">SHOP NOW</a>
            </div>

            <div class="product-item">
                <div class="product-image-container">
                    <img src="images/beanie.jpg" alt="Slouchy Beanie">
                </div>
                <h4 class="product-name">Slouchy Beanie</h4>
                <a href="#" class="shop-now-btn">SHOP NOW</a>
            </div>

            <div class="product-item">
                <div class="product-image-container">
                    <img src="images/handwarmers.jpg" alt="Handwarmers">
                </div>
                <h4 class="product-name">Handwarmers</h4>
                <a href="#" class="shop-now-btn">SHOP NOW</a>
            </div>
        </div>
    </section>

</body>
</html>
